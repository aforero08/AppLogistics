trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - src/**
    - test/**
    - AppLogistics.sln
    - azure-pipelines.yml

pr:
  branches:
    include:
    - develop
  paths:
    include:
    - src/**
    - test/**
    - AppLogistics.sln
    - azure-pipelines.yml

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '8.x'
  projectPath: 'src/AppLogistics.Web/AppLogistics.Web.csproj'
  publishPath: '$(Build.ArtifactStagingDirectory)/publish'
  packagePath: '$(Build.ArtifactStagingDirectory)/AppLogistics.zip'
  minimumLineCoveragePercent: '12'

stages:
- stage: Build
  displayName: 'Build and Publish'
  jobs:
  - job: Build
    displayName: 'Build Application'
    steps:

    # Install .NET SDK
    - task: UseDotNet@2
      displayName: 'Install .NET SDK $(dotnetSdkVersion)'
      inputs:
        packageType: 'sdk'
        version: $(dotnetSdkVersion)
        installationPath: $(Agent.ToolsDirectory)/dotnet

    # Install Node.js (required for npm)
    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: '18.x'

    # Restore NuGet packages
    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: 'AppLogistics.sln'
        arguments: '--property:Configuration=$(buildConfiguration)'


    # Build the project
    - task: DotNetCoreCLI@2
      displayName: 'Build Application'
      inputs:
        command: 'build'
        projects: '$(projectPath)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # Run tests and collect Cobertura coverage.
    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      inputs:
        command: 'test'
        projects: 'test/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/TestResults'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage'
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
        failIfCoverageEmpty: true

    - task: PowerShell@2
      displayName: 'Enforce minimum line coverage'
      condition: succeededOrFailed()
      inputs:
        targetType: 'inline'
        script: |
          $coverageFiles = @(Get-ChildItem -Path "$(Agent.TempDirectory)/TestResults" -Filter 'coverage.cobertura.xml' -Recurse)
          if ($coverageFiles.Count -eq 0) {
            throw 'No Cobertura coverage report was generated.'
          }

          [int64]$linesCovered = 0
          [int64]$linesValid = 0
          foreach ($coverageFile in $coverageFiles) {
            [xml]$coverage = Get-Content -LiteralPath $coverageFile.FullName -Raw
            $linesCovered += [int64]$coverage.coverage.'lines-covered'
            $linesValid += [int64]$coverage.coverage.'lines-valid'
          }

          if ($linesValid -eq 0) {
            throw 'The Cobertura coverage report contains no instrumented lines.'
          }

          $lineCoverage = [math]::Round((100.0 * $linesCovered / $linesValid), 2)
          $minimumLineCoveragePercent = [decimal]'$(minimumLineCoveragePercent)'
          Write-Host "Line coverage: $lineCoverage% (minimum: $minimumLineCoveragePercent%)"

          if ($lineCoverage -lt $minimumLineCoveragePercent) {
            throw "Line coverage $lineCoverage% is below the required $minimumLineCoveragePercent%."
          }

    # Publish the application
    - task: DotNetCoreCLI@2
      displayName: 'Publish Application'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(projectPath)'
        arguments: '--configuration $(buildConfiguration) --output $(publishPath) --no-build'
        zipAfterPublish: false
        modifyOutputPath: false

    # Archive the contents of the publish directory so App Service sees
    # web.config and the application DLLs at the root of the ZIP package.
    - task: ArchiveFiles@2
      displayName: 'Create deployment package'
      inputs:
        rootFolderOrFile: '$(publishPath)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(packagePath)'
        replaceExistingArchive: true

    # Publish build artifacts
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        pathToPublish: '$(packagePath)'
        artifactName: 'drop'
        publishLocation: 'Container'
